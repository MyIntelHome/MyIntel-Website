<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Two ways to add support</title><desc id="desc">Home sensors and optional wearable support serve different needs. Devices, compatibility and response are confirmed for each home.</desc><rect width="1200" height="900" rx="32" fill="#F7F4ED"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#536853">MYINTEL</text><text x="72" y="159" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#142D43">Two ways to add support</text><rect x="72" y="218" width="1056" height="250" rx="22" fill="white"/><g transform="translate(102 258)" fill="none" stroke="#142D43" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 65L85 5l75 60M30 52v100h110V52M66 152V98h38v54"/></g><text x="302" y="279" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142D43">Around the home</text><text x="302" y="327" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Suitable sensors can help notice activity or risks.</text><text x="302" y="370" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Room fall sensing may be an option.</text><text x="302" y="413" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Placement and coverage are checked for the home.</text><rect x="72" y="492" width="1056" height="250" rx="22" fill="white"/><g transform="translate(133 520)" fill="none" stroke="#142D43" stroke-width="8"><rect x="20" y="10" width="52" height="175" rx="17" fill="#DDE6D8"/><rect x="0" y="56" width="92" height="84" rx="20" fill="#F7F4ED"/></g><text x="302" y="554" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142D43">Optional personal support</text><text x="302" y="602" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">A wearable may suit some people.</text><text x="302" y="645" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">We discuss comfort, features and compatibility.</text><text x="302" y="688" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">A wearable is not required for every home plan.</text><text x="72" y="806" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Your devices and response arrangements are confirmed together.</text><text x="72" y="849" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">These are support options, not fixed package contents.</text></svg>