<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">A home plan, built around you</title><desc id="desc">Start with a free home check. Choose suitable improvements and support together. Agree contacts and next steps before installation.</desc><rect width="1200" height="880" rx="32" fill="#F7F4ED"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#536853">MYINTEL</text><text x="72" y="159" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#142D43">A home plan, built around you</text>
<rect x="72" y="218" width="1056" height="157" rx="22" fill="#FFFFFF"/><circle cx="132" cy="296" r="34" fill="#DDE6D8"/><text x="132" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#142D43">1</text><text x="198" y="269" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#142D43">Start with the home</text><text x="198" y="310" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Take the free home check.</text><text x="198" y="347" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Get a clear starting point.</text><rect x="72" y="402" width="1056" height="157" rx="22" fill="#FFFFFF"/><circle cx="132" cy="480" r="34" fill="#DDE6D8"/><text x="132" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#142D43">2</text><text x="198" y="453" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#142D43">Choose support together</text><text x="198" y="494" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Discuss practical improvements and suitable devices.</text><text x="198" y="531" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">The plan fits your home, needs and preferences.</text><rect x="72" y="586" width="1056" height="157" rx="22" fill="#FFFFFF"/><circle cx="132" cy="664" r="34" fill="#DDE6D8"/><text x="132" y="677" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#142D43">3</text><text x="198" y="637" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#142D43">Agree the next steps</text><text x="198" y="678" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Confirm who receives alerts and what happens next.</text><text x="198" y="715" font-family="Arial,sans-serif" font-size="26" fill="#354B5B">Features and response depend on the agreed plan.</text><text x="72" y="825" font-family="Arial,sans-serif" font-size="25" fill="#3